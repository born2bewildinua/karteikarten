<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikasten</title>
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121720" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1C2532; --muted:#667183; --line:#DCE1E8;
  --know:#2C5DA6; --know-ink:#FFFFFF; --know-soft:#E3ECF8;
  --miss:#B0473C; --miss-ink:#FFFFFF; --miss-soft:#F7E6E3;
  --wheat:#E0AE38; --track:#E8EBF0;
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --word:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121720; --surface:#1B222D; --ink:#E7EBF1; --muted:#97A2B2; --line:#2C3542;
    --know:#5C8FDB; --know-ink:#0E1420; --know-soft:#1F2C42;
    --miss:#D9705F; --miss-ink:#1A0F0D; --miss-soft:#3A2522;
    --wheat:#E6B94A; --track:#2A3240; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121720; --surface:#1B222D; --ink:#E7EBF1; --muted:#97A2B2; --line:#2C3542;
  --know:#5C8FDB; --know-ink:#0E1420; --know-soft:#1F2C42;
  --miss:#D9705F; --miss-ink:#1A0F0D; --miss-soft:#3A2522;
  --wheat:#E6B94A; --track:#2A3240; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--know);outline-offset:2px}
#main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
body.in-session #main{padding-bottom:24px}
h1{font-size:1.6rem;font-weight:600;margin:4px 0 18px;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600;margin:28px 0 10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* Buttons */
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--know);color:var(--know-ink);box-shadow:none}
.btn.danger{background:transparent;color:var(--miss);box-shadow:inset 0 0 0 1px var(--miss)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--know);padding:10px 4px;min-height:40px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:0;background:transparent;width:44px;height:44px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--track)}
.iconbtn svg{width:22px;height:22px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;max-width:186px;border:0;background:transparent;padding:10px 0 12px;color:var(--muted);font-size:.8rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--know)}
body.in-session .tabs{display:none}

/* Learn home */
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:14px;padding:6px 6px 6px 4px;box-shadow:inset 0 0 0 1px var(--line)}
.prow.on{box-shadow:inset 0 0 0 2px var(--know)}
.prow label{flex:1;display:flex;align-items:center;gap:12px;padding:10px;cursor:pointer;min-width:0}
.prow input{width:22px;height:22px;accent-color:var(--know);flex:none}
.prow .pname{font-weight:600;display:block}
.prow .pmeta{font-size:.88rem;color:var(--muted)}
.start{margin-top:20px}
.alldone{margin-top:20px;padding:18px;border-radius:14px;background:var(--know-soft);text-align:center}

/* Session */
.stop{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.stop .bar{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.stop .bar i{display:block;height:100%;background:var(--wheat);transition:width .3s}
.stop .count{font-size:.85rem;color:var(--muted);min-width:64px;text-align:right}
.card{background:var(--surface);border-radius:20px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,50,.35);padding:16px 20px 14px;min-height:340px;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chead{display:flex;align-items:center;gap:10px}
.steps{display:flex;gap:4px}
.steps i{width:18px;height:6px;border-radius:3px;background:var(--track)}
.steps i.on{background:var(--wheat)}
.chead .slabel{font-size:.8rem;color:var(--muted)}
.chead .proj{font-size:.8rem;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .iconbtn{margin-left:auto;margin-right:-10px}
.chead .proj + .iconbtn{margin-left:0}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:22px 0 10px}
.front{font-family:var(--word);font-size:clamp(1.6rem,6vw,2.1rem);font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.back{font-family:var(--word);font-size:clamp(1.25rem,5vw,1.6rem);line-height:1.35;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.note{margin-top:14px;font-size:.95rem;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;white-space:pre-wrap}
.cimg{margin-top:14px;max-width:100%;max-height:220px;border-radius:10px;align-self:center;object-fit:contain}
.tap{margin-top:14px;font-size:.85rem;color:var(--muted)}
.src{font-size:.72rem;color:var(--muted);text-align:center;padding-top:8px}
.answers{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abtn{border:0;border-radius:14px;padding:14px 10px;font-weight:600;font-size:1.02rem;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.abtn small{font-weight:400;font-size:.78rem;opacity:.85}
.abtn.no{background:var(--miss);color:var(--miss-ink)}
.abtn.yes{background:var(--know);color:var(--know-ink)}
.jrow{display:flex;gap:10px;justify-content:flex-end}
.jbtn{border:0;border-radius:10px;padding:8px 14px;background:var(--know-soft);color:var(--know);font-weight:500;font-size:.88rem;min-height:40px}
.jlabel{font-size:.85rem;color:var(--muted);align-self:center;margin-right:auto;white-space:nowrap}
.reveal{border:0;border-radius:14px;min-height:64px;width:100%;background:var(--ink);color:var(--surface);font-weight:600;font-size:1.02rem}
.finish{text-align:center;padding:60px 10px}
.finish .big{font-family:var(--word);font-size:1.8rem;font-weight:600;margin-bottom:8px}

/* Words */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:48px}
textarea.field{min-height:84px;resize:vertical}
.toolbar .field{flex:1 1 140px;width:auto}
.toolbar .search{flex-basis:100%}
.wlist{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .wt{flex:1;min-width:0}
.wrow .wa{display:block;font-weight:500;overflow-wrap:anywhere}
.wrow .wb{display:block;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.badge{flex:none;min-width:34px;text-align:center;font-size:.78rem;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--track);color:var(--muted)}
.badge.s1,.badge.s2{background:var(--miss-soft);color:var(--miss)}
.badge.s3,.badge.s4{background:var(--know-soft);color:var(--know)}
.badge.s5,.badge.s6{background:var(--wheat);color:#2A2108}
.whead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.whead h1{margin-bottom:12px}
.more{display:block;margin:12px auto 0}

/* Stats */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fig{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 12px}
.fig b{display:block;font-size:1.6rem;font-weight:600;line-height:1.1}
.fig span{font-size:.82rem;color:var(--muted)}
.bars{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:8px 14px}
.brow{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;padding:8px 0}
.brow .bl{font-size:.88rem}
.brow .bl small{display:block;color:var(--muted);font-size:.75rem}
.brow .bt{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:6px;background:var(--know)}
.brow.new .bt i{background:var(--muted)}
.brow .bn{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.backup{display:flex;flex-wrap:wrap;gap:10px}
.backup .btn{flex:1 1 200px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.sheet h2{margin:0 0 14px;font-size:1.2rem}
.sheet label.lb{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px}
.sheet .row2{display:flex;gap:10px;margin-top:20px}
.sheet .row2 .btn{flex:1}
.sheet .del{margin-top:24px;width:100%}
.imgbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imgbox img{max-width:120px;max-height:90px;border-radius:8px}
.tog{display:flex;gap:6px}
.tog button{flex:1;border:0;border-radius:10px;padding:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;min-height:44px}
.tog button[aria-pressed="true"]{background:var(--know-soft);box-shadow:inset 0 0 0 2px var(--know);color:var(--know)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
#toast.show{opacity:1}
.warn{background:var(--miss-soft);color:var(--miss);border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.no-tabs .tabs{display:none}
body.no-tabs #main{padding-bottom:24px}
.login{max-width:400px;margin:8vh auto 0}
.login .brand{font-family:var(--word);font-size:2rem;font-weight:600;margin:0 0 6px}
.login .btn.primary{margin-top:20px}
.err{color:var(--miss);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.setup .btn{margin-top:10px}
.sync{display:flex;align-items:center;gap:8px;font-size:.9rem}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--know);flex:none}
.sync.pending i{background:var(--wheat)}
.sync.off i{background:var(--muted)}
</style>
</head>

async function loadFirebase(cfg){
  if (window.__FB_MOCK__) return window.__FB_MOCK__;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A, AU, F] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = A.initializeApp(cfg);
  const auth = AU.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.getFirestore(app); }
  return {
    onAuth: cb => AU.onAuthStateChanged(auth, u => cb(u ? { uid:u.uid, email:u.email } : null)),
    signIn: (e,p) => AU.signInWithEmailAndPassword(auth, e, p),
    signOut: () => AU.signOut(auth),
    resetPw: e => AU.sendPasswordResetEmail(auth, e),
    doc: (...p) => F.doc(db, ...p),
    col: (...p) => F.collection(db, ...p),
    listenCol: (c, cb, err) => F.onSnapshot(c, { includeMetadataChanges:true }, s => cb({
      docs: s.docs.map(d => ({ id:d.id, data:d.data() })),
      changes: s.docChanges().map(ch => ({ type:ch.type, id:ch.doc.id, data:ch.doc.data() })),
      fromCache: s.metadata.fromCache, pending: s.metadata.hasPendingWrites }), err),
    listenDoc: (r, cb, err) => F.onSnapshot(r, { includeMetadataChanges:true }, s => cb({ exists:s.exists(), data:s.exists() ? s.data() : null, fromCache:s.metadata.fromCache }), err),
    set: (r,d) => F.setDoc(r, d),
    del: r => F.deleteDoc(r),
    get: async r => { const s = await F.getDoc(r); return s.exists() ? s.data() : null; },
    getAll: async c => { const s = await F.getDocs(c); return s.docs.map(d => ({ id:d.id, data:d.data() })); },
    batch: () => { const b = F.writeBatch(db); return { set:(r,d) => b.set(r,d), del:r => b.delete(r), commit:() => b.commit() }; }
  };
}

async function runOps(ops, onProg){
  for (let i = 0; i < ops.length; i += 400){
    const b = FB.batch();
    ops.slice(i, i+400).forEach(([t, r, d]) => t === 'set' ? b.set(r, d) : b.del(r));

    if (onProg) onProg(Math.min(ops.length, i+400), ops.length);
  }
}

    S.projects = s.docs.map(d => ({ id:d.id, ...d.data })).sort((a,b) => (a.o||0) - (b.o||0));

const proj = id => S.projects.find(p => p.id === id);
const card = id => cardMap.get(id);
const isDue = (c, t) => c.s > 0 && c.d <= t;
function newLeft(p){
  const t = today(), lg = S.log[p.id], used = lg && lg.d === t ? lg.n : 0;
  const avail = S.cards.reduce((n,c) => n + (c.p === p.id && c.s === 0 ? 1 : 0), 0);
  return Math.max(0, Math.min((p.np|0) - used, avail));
}
function dueCount(pid){ const t = today(); return S.cards.reduce((n,c) => n + (c.p === pid && isDue(c,t) ? 1 : 0), 0); }
function buildQueue(pids){
  const t = today(), q = [];
  for (const pid of pids){
    const p = proj(pid); if (!p) continue;
    S.cards.forEach(c => { if (c.p === pid && isDue(c,t)) q.push(c.id); });
    S.cards.filter(c => c.p === pid && c.s === 0).slice(0, newLeft(p)).forEach(c => q.push(c.id));
  }
  return shuffle(q);
}

  } else body.append(h('div',{class:'tap'},'Tippen zum Aufdecken'));

    h('div',{class:'chead'}, steps, h('span',{class:'slabel'}, stageName(c.s)),
      session.multi ? h('span',{class:'proj'}, p.name) : null,
      h('button',{class:'iconbtn','aria-label':'Karte bearbeiten', onclick:() => cardModal(c)}, svg(ICON.edit))),
    body,

  const ans = h('div',{class:'answers'});
  if (!session.revealed){
    ans.append(h('button',{class:'reveal', onclick:reveal}, 'Lösung zeigen'));
  } else {
    const failed = c.f === t;
    const yesTo = failed ? 1 : Math.min(MAX, c.s + 1);
    ans.append(h('div',{class:'arow'},
      h('button',{class:'abtn no', onclick:() => answer('no')}, 'Weiß ich nicht', h('small',null,'kommt gleich nochmal')),
      h('button',{class:'abtn yes', onclick:() => answer('yes')}, 'Weiß ich', h('small',null, days(INT[yesTo])))));
    if (!failed){
      const jr = h('div',{class:'jrow'});
      for (const k of [2,3]){ const ns = c.s + k; if (ns <= MAX) jr.append(h('button',{class:'jbtn', title:`Stufe ${ns}`, onclick:() => answer('j'+k)}, days(INT[ns]))); }
      if (jr.children.length){ jr.prepend(h('span',{class:'jlabel'},'Oder direkt:')); ans.append(jr); }
    } else ans.append(h('div',{class:'small muted', style:'text-align:center'},'Heute schon einmal nicht gewusst, darum zurück auf Stufe 1.'));
  }
  m.append(ans);
}
function reveal(){ session.revealed = true; renderSession(); }
function answer(k){
  const id = session.q[0], c = { ...card(id) }, t = today();
  session.undo = { id, snap:{ ...card(id) }, q:[...session.q], done:session.done, log:JSON.parse(JSON.stringify(S.log)) };
  let metaChanged = false;
  if (c.s === 0){ const lg = S.log[c.p]; if (lg && lg.d === t) lg.n++; else S.log[c.p] = { d:t, n:1 }; metaChanged = true; }
  if (k === 'no'){ c.s = 1; c.d = t; c.f = t; session.q.push(session.q.shift()); }
  else {
    const ns = c.f === t ? 1 : Math.min(MAX, c.s + (k === 'yes' ? 1 : k === 'j2' ? 2 : 3));
    c.s = ns; c.d = addDays(INT[ns]); session.q.shift(); session.done++;
  }
  cardMap.set(id, c); S.cards = S.cards.map(x => x.id === id ? c : x);
  saveCard(c); if (metaChanged) saveMeta();
  session.revealed = false; renderSession();
}
function undo(){
  const u = session.undo; if (!u) return;
  cardMap.set(u.id, u.snap); S.cards = S.cards.map(x => x.id === u.id ? u.snap : x);
  saveCard(u.snap);
  if (JSON.stringify(S.log) !== JSON.stringify(u.log)){ S.log = u.log; saveMeta(); }
  session.q = u.q; session.done = u.done; session.undo = null; session.revealed = true;
  renderSession();
}
document.addEventListener('keydown', e => {
  if (!session || !$('#modal').hidden || !session.q.length || e.target.matches('input,textarea,select')) return;
  if (!session.revealed && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); reveal(); }
  else if (session.revealed && e.key === '1') answer('no');
  else if (session.revealed && e.key === '2') answer('yes');
});

  } catch (e) { if (e && e.name === 'AbortError') return; }

async function importBackup(obj, onProg){
  const st = obj.state, ops = [];
  const oldImgs = S.cards.filter(c => c.img).map(c => c.id);
  S.cards.forEach(c => ops.push(['del', R.card(c.id)]));
  oldImgs.forEach(id => ops.push(['del', R.img(id)]));
  S.projects.forEach(p => ops.push(['del', R.project(p.id)]));
  st.projects.forEach((p,i) => { const { id, ...d } = p; ops.push(['set', R.project(id), { ...d, o: d.o ?? i }]); });
  st.cards.forEach((c,i) => { const { id, ...d } = c; ops.push(['set', R.card(id), { n:'', src:'', f:null, img:false, ...d, o: d.o ?? i }]); });
  await runOps(ops, onProg);
  for (const [id, data] of Object.entries(obj.images || {})) await FB.set(R.img(id), { data });
  imgCache.clear();
  await FB.set(R.meta(), { log: st.log || {}, sel: st.sel || [], lastSrc: st.lastSrc || '' });
}

function compressImage(file, maxSide = 800, q = 0.72){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let side = maxSide, quality = q, out;
      do {
        const k = Math.min(1, side / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        out = cv.toDataURL('image/jpeg', quality); side = Math.round(side*0.75); quality = Math.max(0.5, quality - 0.08);
      } while (out.length > 700000 && side > 200);
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

      const base = isNew ? { id:uid(), p:pid, s:0, d:null, f:null, img:false, o:Date.now() } : { ...(card(c.id) || c) };
      const target = { ...base, a, b, n:fn.value.trim(), src:fs.value.trim() };
      if (imgState.changed){
        if (imgState.data){ FB.set(R.img(target.id), { data:imgState.data }).catch(syncErr); imgCache.set(target.id, imgState.data); target.img = true; }
        else { FB.del(R.img(target.id)).catch(()=>{}); imgCache.delete(target.id); target.img = false; }
      }
      saveCard(target);
      if (target.src && target.src !== S.lastSrc){ S.lastSrc = target.src; saveMeta(); }
      closeModal(); toast(isNew ? 'Wort hinzugefügt' : 'Gespeichert');
    }}, isNew ? 'Hinzufügen' : 'Speichern')));
  if (c) wrap.append(confirmBtn('Wort löschen', () => {
    FB.del(R.card(c.id)).catch(syncErr);
    if (c.img) FB.del(R.img(c.id)).catch(()=>{});
    if (session){ session.q = session.q.filter(x => x !== c.id); session.total = session.done + session.q.length; if (session.undo && session.undo.id === c.id) session.undo = null; }
    closeModal(); toast('Wort gelöscht');
  }));
  openModal(wrap);
}
function projectModal(p){
  const isNew = !p;
  const fname = h('input',{class:'field', value:p ? p.name : '', placeholder:'z. B. Deutsch – Spanisch'});
  const ffl = h('input',{class:'field', value:p ? p.fl : 'Deutsch'});
  const fbl = h('input',{class:'field', value:p ? p.bl : ''});
  const fnp = h('input',{class:'field', type:'number', min:'0', max:'500', inputmode:'numeric', value:p ? p.np : 20});
  let rev = p ? !!p.rev : false;
  const tog = h('div',{class:'tog'});
  const drawTog = () => { tog.innerHTML = ''; [false,true].forEach(v => tog.append(h('button',{'aria-pressed':String(rev === v), onclick:() => { rev = v; drawTog(); }},
    (v ? (fbl.value || 'Rückseite') : (ffl.value || 'Vorderseite')) + ' zuerst'))); };
  ffl.addEventListener('input', drawTog); fbl.addEventListener('input', drawTog); drawTog();
  const wrap = h('div',null, h('h2',null, isNew ? 'Neues Projekt' : 'Projekt-Einstellungen'),
    h('label',{class:'lb'},'Name'), fname,
    h('label',{class:'lb'},'Sprache Vorderseite'), ffl,
    h('label',{class:'lb'},'Sprache Rückseite'), fbl,
    h('label',{class:'lb'},'Was wird beim Lernen zuerst gezeigt?'), tog,
    h('label',{class:'lb'},'Neue Wörter pro Tag'), fnp,
    h('div',{class:'row2'},
      h('button',{class:'btn', onclick:closeModal}, 'Abbrechen'),
      h('button',{class:'btn primary', onclick:() => {
        const name = fname.value.trim(); if (!name){ toast('Bitte einen Namen eingeben.'); return; }
        const np = Math.max(0, Math.min(500, parseInt(fnp.value, 10) || 0));
        const d = { name, fl:ffl.value.trim()||'Vorderseite', bl:fbl.value.trim()||'Rückseite', rev, np };
        if (isNew){ const id = uid(); saveProject({ id, ...d, o:Date.now() }); S.sel = [...S.sel, id]; saveMeta(); }
        else saveProject({ ...p, ...d });
        closeModal(); toast(isNew ? 'Projekt angelegt' : 'Gespeichert');
      }}, isNew ? 'Anlegen' : 'Speichern')));
  if (p){
    const mine = S.cards.filter(c => c.p === p.id);
    wrap.append(confirmBtn(`Projekt mit ${mine.length} Wörtern löschen`, async () => {
      closeModal(); toast('Projekt wird gelöscht …');
      const ops = [];
      mine.forEach(c => { ops.push(['del', R.card(c.id)]); if (c.img) ops.push(['del', R.img(c.id)]); });
      ops.push(['del', R.project(p.id)]);
      try { await runOps(ops); S.sel = S.sel.filter(x => x !== p.id); delete S.log[p.id]; saveMeta(); toast('Projekt gelöscht'); }
      catch (e) { syncErr(e); }
    }));
  }
  openModal(wrap);
}

/* ---------- boot ---------- */
(async function boot(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!window.__FB_MOCK__ && String(FIREBASE_CONFIG.apiKey).startsWith('HIER')){
    bootMsg = 'Die App ist noch nicht mit Firebase verbunden. Trage die Firebase-Konfiguration oben in der Datei index.html ein (siehe Anleitung).';
    return render();
  }
  try { FB = await loadFirebase(FIREBASE_CONFIG); }
  catch (e) { console.error(e); bootMsg = 'Die App konnte nicht starten. Prüfe die Internetverbindung und lade die Seite neu.'; return render(); }
  FB.onAuth(u => {
    session = null; closeModal();
    if (u){ U = u.uid; userEmail = u.email || ''; bootMsg = 'Lädt …'; listen(); }
    else { U = null; stopListen(); S = { projects:[], cards:[], log:{}, sel:[], lastSrc:'' }; cardMap.clear(); }
    render();
  });
})();

</script>
